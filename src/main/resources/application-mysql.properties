# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=${BIZFLOW_DB_URL:jdbc:mysql://localhost:3306/bizflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${BIZFLOW_DB_USER:root}
spring.datasource.password=${BIZFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
