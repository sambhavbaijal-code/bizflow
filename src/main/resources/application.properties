spring.application.name=BizFlow
server.port=8080

# Local file database. VS Code launches the app from the workspace root (see .vscode/launch.json),
# so this keeps data/bizflow.mv.db stable across runner restarts. Override when needed with BIZFLOW_H2_URL.
spring.datasource.url=${BIZFLOW_H2_URL:jdbc:h2:file:./data/bizflow;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false

# BharatCode-powered business assistant. Keep the API key on the server only.
bharatcode.api-key=${BHARATCODE_API_KEY:}
bharatcode.base-url=${BHARATCODE_BASE_URL:https://bharatcode.ai/api/model/v1}
bharatcode.model=${BHARATCODE_MODEL:qwen-3.8-27b}
